<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Payment</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#07111f;
  color:#fff;
  padding:24px 14px;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
}

.card{
  background:#0c1a2b;
  border:1px solid #263c59;
  border-radius:28px;
  padding:34px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  width:80px;
  height:80px;
  border-radius:24px;
  background:#152b45;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:43px;
  margin-bottom:30px;
}

h1{
  font-size:42px;
  margin:0 0 10px;
}

.subtitle{
  color:#9eacc0;
  font-size:20px;
  line-height:1.5;
  margin-bottom:35px;
}

label{
  display:block;
  font-size:18px;
  font-weight:700;
  margin:25px 0 10px;
}

select,
input{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:1px solid #314762;
  background:#071522;
  color:#fff;
  font-size:17px;
  outline:none;
}

select:focus,
input:focus{
  border-color:#4b82ff;
}

button{
  width:100%;
  margin-top:28px;
  padding:19px;
  border:0;
  border-radius:18px;
  background:#2864ff;
  color:white;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.99);
}

.status{
  margin-top:24px;
  padding:20px;
  border-radius:18px;
  display:none;
  line-height:1.6;
}

.success{
  display:block;
  background:#0d3024;
  border:1px solid #21a875;
  color:#b8ffe4;
}

.error{
  display:block;
  background:#32151b;
  border:1px solid #d94c62;
  color:#ffc4ce;
}

.loading{
  display:block;
  background:#17253a;
  border:1px solid #385170;
  color:#dce8f8;
}

.receipt{
  margin-top:18px;
  background:#081522;
  border:1px solid #30465f;
  border-radius:18px;
  padding:20px;
}

.receipt div{
  padding:8px 0;
  border-bottom:1px solid #1c3045;
  word-break:break-word;
}

.receipt div:last-child{
  border-bottom:0;
}

.small{
  color:#8798ad;
  font-size:14px;
  margin-top:25px;
  line-height:1.5;
}

a{
  color:#76a2ff;
  word-break:break-all;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">₿</div>

    <h1>Crypto Payment</h1>

    <div class="subtitle">
      Verify a cryptocurrency payment using its blockchain transaction hash.
    </div>

    <label for="network">Network / Coin</label>

    <select id="network">
      <option value="ethereum">Ethereum — ETH</option>
      <option value="bnb">BNB Smart Chain — BNB</option>
      <option value="polygon">Polygon — POL</option>
      <option value="base">Base — ETH</option>
      <option value="arbitrum">Arbitrum One — ETH</option>
      <option value="optimism">Optimism — ETH</option>
    </select>

    <label for="receiver">Receiver wallet address</label>

    <input
      id="receiver"
      type="text"
      placeholder="0x..."
      autocomplete="off"
    >

    <label for="amount">Expected amount</label>

    <input
      id="amount"
      type="number"
      step="any"
      min="0"
      placeholder="Example: 0.05"
    >

    <label for="txhash">Transaction hash</label>

    <input
      id="txhash"
      type="text"
      placeholder="0x..."
      autocomplete="off"
    >

    <button onclick="verifyPayment()">
      Verify Payment
    </button>

    <div id="status" class="status"></div>

    <div class="small">
      Only enter a public wallet address and transaction hash.
      Never enter a recovery phrase, private key, wallet password, or PIN.
    </div>

  </div>

</div>

<script>

const networks = {

  ethereum: {
    name: "Ethereum",
    symbol: "ETH",
    api: "https://eth.blockscout.com",
    explorer: "https://eth.blockscout.com/tx/"
  },

  bnb: {
    name: "BNB Smart Chain",
    symbol: "BNB",
    api: "https://bsc.blockscout.com",
    explorer: "https://bsc.blockscout.com/tx/"
  },

  polygon: {
    name: "Polygon",
    symbol: "POL",
    api: "https://polygon.blockscout.com",
    explorer: "https://polygon.blockscout.com/tx/"
  },

  base: {
    name: "Base",
    symbol: "ETH",
    api: "https://base.blockscout.com",
    explorer: "https://base.blockscout.com/tx/"
  },

  arbitrum: {
    name: "Arbitrum One",
    symbol: "ETH",
    api: "https://arbitrum.blockscout.com",
    explorer: "https://arbitrum.blockscout.com/tx/"
  },

  optimism: {
    name: "Optimism",
    symbol: "ETH",
    api: "https://optimism.blockscout.com",
    explorer: "https://optimism.blockscout.com/tx/"
  }

};


function showStatus(type, html){

  const status = document.getElementById("status");

  status.className = "status " + type;

  status.innerHTML = html;

}


async function verifyPayment(){

  const networkKey =
    document.getElementById("network").value;

  const receiver =
    document.getElementById("receiver").value.trim();

  const expected =
    parseFloat(document.getElementById("amount").value);

  const txHash =
    document.getElementById("txhash").value.trim();

  const network =
    networks[networkKey];


  if(!receiver){

    showStatus(
      "error",
      "Please enter the receiver wallet address."
    );

    return;
  }


  if(!/^0x[a-fA-F0-9]{40}$/.test(receiver)){

    showStatus(
      "error",
      "The receiver address does not look like a valid EVM wallet address."
    );

    return;
  }


  if(!expected || expected <= 0){

    showStatus(
      "error",
      "Please enter the expected payment amount."
    );

    return;
  }


  if(!/^0x[a-fA-F0-9]{64}$/.test(txHash)){

    showStatus(
      "error",
      "Please enter a valid transaction hash."
    );

    return;
  }


  showStatus(
    "loading",
    "Checking the blockchain transaction..."
  );


  try{

    const response = await fetch(
      network.api +
      "/api/v2/transactions/" +
      txHash
    );


    if(!response.ok){

      throw new Error(
        "Transaction could not be found on this network."
      );

    }


    const tx = await response.json();


    if(tx.status !== "ok"){

      showStatus(
        "error",
        "The transaction has not been successfully confirmed."
      );

      return;
    }


    const blockchainReceiver =
      tx.to && tx.to.hash
        ? tx.to.hash.toLowerCase()
        : "";


    if(blockchainReceiver !== receiver.toLowerCase()){

      showStatus(
        "error",
        "The transaction was found, but it was not sent to the receiver wallet entered above."
      );

      return;
    }


    const valueWei =
      BigInt(tx.value || "0");


    const value =
      Number(valueWei) / 1e18;


    if(value < expected){

      showStatus(
        "error",
        "Payment found, but the amount received is lower than the expected amount."
        +
        "<br><br>"
        +
        "Received: " +
        value +
        " " +
        network.symbol
        +
        "<br>"
        +
        "Expected: " +
        expected +
        " " +
        network.symbol
      );

      return;
    }


    const explorer =
      network.explorer + txHash;


    showStatus(
      "success",
      `
      <strong style="font-size:22px;">
      ✓ PAYMENT RECEIVED
      </strong>

      <div class="receipt">

        <div>
          <strong>Network:</strong><br>
          ${network.name}
        </div>

        <div>
          <strong>Coin:</strong><br>
          ${network.symbol}
        </div>

        <div>
          <strong>Amount received:</strong><br>
          ${value} ${network.symbol}
        </div>

        <div>
          <strong>Receiver:</strong><br>
          ${receiver}
        </div>

        <div>
          <strong>Transaction:</strong><br>
          ${txHash}
        </div>

        <div>
          <strong>Status:</strong><br>
          Confirmed
        </div>

        <div>
          <a
            href="${explorer}"
            target="_blank"
            rel="noopener noreferrer"
          >
            View transaction on blockchain explorer
          </a>
        </div>

      </div>
      `
    );


  }catch(error){

    showStatus(
      "error",
      "Unable to verify this transaction right now."
      +
      "<br><br>"
      +
      error.message
    );

  }

}

</script>

</body>
</html>
