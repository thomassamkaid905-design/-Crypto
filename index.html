<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Crypto Payment</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:22px;
}

.card{
  background:#0d1929;
  border:1px solid #24344a;
  border-radius:24px;
  padding:24px;
  box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  background:#17283e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:28px;
}

.subtitle{
  color:#9eacc0;
  margin:8px 0 25px;
  line-height:1.5;
}

label{
  display:block;
  margin:17px 0 8px;
  font-weight:600;
}

input,select{
  width:100%;
  padding:15px;
  border-radius:13px;
  border:1px solid #33465e;
  background:#081321;
  color:#fff;
  font-size:15px;
  outline:none;
}

input:focus,select:focus{
  border-color:#5c8dff;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:13px;
  background:#2764ff;
  color:white;
  font-size:16px;
  font-weight:700;
}

button:active{
  transform:scale(.99);
}

.status{
  display:none;
  margin-top:22px;
  padding:18px;
  border-radius:15px;
  line-height:1.6;
}

.waiting{
  background:#18263a;
  color:#cbd7e8;
}

.success{
  background:#07351f;
  border:1px solid #1c9d5a;
  color:#b7ffd5;
}

.error{
  background:#3a1212;
  border:1px solid #b84242;
  color:#ffc3c3;
}

.details{
  margin-top:15px;
  padding:15px;
  border-radius:12px;
  background:#081321;
  font-size:14px;
}

.hash{
  word-break:break-all;
  font-family:monospace;
  color:#8db1ff;
}

.warning{
  margin-top:24px;
  padding:15px;
  border-radius:13px;
  background:#33280d;
  color:#ffe7a3;
  font-size:13px;
  line-height:1.5;
}

a{
  color:#8db1ff;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">₿</div>

<h1>Crypto Payment</h1>

<div class="subtitle">
Verify a cryptocurrency payment using its blockchain transaction hash.
</div>

<label>Network</label>

<select id="network">
  <option value="ethereum">Ethereum</option>
</select>

<label>Receiver wallet address</label>

<input
  id="receiver"
  placeholder="0x..."
  autocomplete="off"
>

<label>Expected amount</label>

<input
  id="amount"
  type="number"
  step="any"
  min="0"
  placeholder="Example: 100"
>

<label>Transaction hash</label>

<input
  id="txHash"
  placeholder="0x transaction hash"
  autocomplete="off"
>

<button onclick="verifyPayment()">
Verify Payment
</button>

<div id="status" class="status"></div>

<div class="warning">
<strong>Security:</strong><br>
Never enter a recovery phrase, seed phrase, private key,
wallet password or PIN here. This page only uses public blockchain
information.
</div>

</div>

</div>

<script>

const API =
"https://eth.blockscout.com/api/v2/transactions/";

const EXPLORER =
"https://eth.blockscout.com/tx/";

function showStatus(type,message){

  const box=document.getElementById("status");

  box.className="status "+type;

  box.style.display="block";

  box.innerHTML=message;
}

function normalizeAddress(address){

  return address.trim().toLowerCase();

}

async function verifyPayment(){

  const receiver=
    normalizeAddress(
      document.getElementById("receiver").value
    );

  const expectedAmount=
    parseFloat(
      document.getElementById("amount").value
    );

  const txHash=
    document.getElementById("txHash").value.trim();

  if(!receiver){

    showStatus(
      "error",
      "Please enter the receiver wallet address."
    );

    return;
  }

  if(!receiver.startsWith("0x") || receiver.length !== 42){

    showStatus(
      "error",
      "Please enter a valid Ethereum receiver address."
    );

    return;
  }

  if(!txHash){

    showStatus(
      "error",
      "Please enter the transaction hash."
    );

    return;
  }

  if(!txHash.startsWith("0x") || txHash.length !== 66){

    showStatus(
      "error",
      "That does not look like a valid Ethereum transaction hash."
    );

    return;
  }

  showStatus(
    "waiting",
    "⏳ Checking the blockchain...<br>Please wait."
  );

  try{

    const response =
      await fetch(
        API + encodeURIComponent(txHash)
      );

    if(!response.ok){

      throw new Error(
        "Transaction was not found."
      );

    }

    const tx =
      await response.json();

    const txStatus =
      String(tx.status || "").toLowerCase();

    const confirmations =
      Number(tx.confirmations || 0);

    const transactionTo =
      tx.to && tx.to.hash
        ? tx.to.hash.toLowerCase()
        : "";

    if(txStatus !== "ok"){

      showStatus(
        "error",
        "❌ The transaction is not confirmed successfully yet."
      );

      return;
    }

    if(transactionTo !== receiver){

      showStatus(
        "error",
        "❌ This transaction was not sent to the receiver address provided."
      );

      return;
    }

    /*
      Native ETH transaction value is returned in wei.
      Convert it to ETH.
    */

    const rawValue =
      BigInt(tx.value || "0");

    const ethValue =
      Number(rawValue) / 1e18;

    if(
      !Number.isNaN(expectedAmount) &&
      expectedAmount > 0 &&
      ethValue < expectedAmount
    ){

      showStatus(
        "error",
        "❌ The confirmed amount is lower than the expected amount."
      );

      return;
    }

    showStatus(
      "success",

      `
      <strong>✓ PAYMENT RECEIVED</strong>

      <div class="details">

        <div>
          <strong>Amount:</strong>
          ${ethValue} ETH
        </div>

        <div>
          <strong>Confirmations:</strong>
          ${confirmations}
        </div>

        <div>
          <strong>Transaction:</strong>
        </div>

        <div class="hash">
          ${txHash}
        </div>

        <br>

        <a
          href="${EXPLORER}${encodeURIComponent(txHash)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          View transaction on blockchain
        </a>

      </div>
      `
    );

  }catch(error){

    showStatus(
      "error",

      `
      ❌ Payment could not be verified.

      <br><br>

      Make sure the transaction hash is correct and that
      the transaction exists on Ethereum.
      `
    );

    console.error(error);

  }

}

</script>

</body>
</html>
